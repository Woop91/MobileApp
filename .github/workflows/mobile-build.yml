name: Mobile App CI

on:
  push:
    branches: [ Main, master, 'claude/**' ]
  pull_request:
    branches: [ Main, master ]

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --coverage --ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-coverage
          path: coverage/
          retention-days: 14

  eas-build-preview:
    name: EAS Preview Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/Main'

    steps:
      - name: Check Expo token
        id: expo-token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "## Mobile Preview Build" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Skipped: EXPO_TOKEN repository secret is not configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.expo-token.outputs.available == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        if: steps.expo-token.outputs.available == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install EAS CLI
        if: steps.expo-token.outputs.available == 'true'
        run: npm install -g eas-cli@latest

      - name: Install dependencies
        if: steps.expo-token.outputs.available == 'true'
        run: npm ci

      - name: Build preview (Android APK)
        if: steps.expo-token.outputs.available == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive

      - name: Build summary
        if: steps.expo-token.outputs.available == 'true'
        run: |
          echo "## Mobile Preview Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: Android (APK)" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile**: preview" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: Push to Main" >> $GITHUB_STEP_SUMMARY
